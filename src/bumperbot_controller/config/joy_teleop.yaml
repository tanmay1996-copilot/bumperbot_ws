joy_teleop:
  ros__parameters:
    max_linear_speed: 1.0
    max_angular_speed: 0.5
    speed_step: 0.05
    move:
      type: topic
      interface: geometry_msgs/msg/TwistStamped
      topic_name: /bumperbot_joystick/cmd_vel

      deadman_buttons: [5]

      axis_mappings:
        twist-linear-x: 
          axis: 1
          scale: 1.0
          offset: 0.0
        twist-angular-z:
          axis: 3
          scale: 1.0
          offset: 0.0